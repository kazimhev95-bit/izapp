# VDS nginx ayari: iz.80-240-17-26.sslip.io -> 127.0.0.1:3700  (İZ yol eşleştirme servisi)
# Konum verisi taşıdığı için erişim günlüğü KAPALI. Yalnız kendi alt alan adını dinler; diğer sitelere dokunmaz.
# HTTPS satırlarını certbot ekler:  certbot --nginx -d iz.80-240-17-26.sslip.io --redirect
limit_req_zone $binary_remote_addr zone=izmatch:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=izsync:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name iz.80-240-17-26.sslip.io;

    access_log off;
    error_log /var/log/nginx/iz.error.log;
    client_max_body_size 3m;

    # Veri aktarımı (sunucu yedeği, 127.0.0.1:3703): gövde 1 MB'a kadar; gerçek istemci adresi X-Real-IP'de
    # (servis hatalı kimlik deneyen IP'yi kilitler). Yalnız HTTPS (HSTS).
    location /v1/sync/ {
        limit_req zone=izsync burst=40 nodelay;
        client_max_body_size 1m;
        add_header Strict-Transport-Security "max-age=31536000" always;
        proxy_pass http://127.0.0.1:3703;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location / {
        # telefon parçaları topluca yollar; saniyede 3 istek + 30'luk sıçrama yeter, fazlası kötüye kullanım
        limit_req zone=izmatch burst=30 nodelay;
        proxy_pass http://127.0.0.1:3700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
